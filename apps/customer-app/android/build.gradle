// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

def monorepoRoot = rootDir.getParentFile().getParentFile().getParentFile()
def projectRootDir = rootDir.getParentFile()

def findFile = { String relativePath ->
  def local = new File(projectRootDir, relativePath)
  if (local.exists()) return local
  def root = new File(monorepoRoot, relativePath)
  if (root.exists()) return root
  return local
}

def rnDir = findFile("node_modules/react-native")
def jscAndroidDir = findFile("node_modules/jsc-android")

allprojects {
    repositories {
        maven {
            url(new File(rnDir, 'android'))
        }
        maven {
            url(new File(jscAndroidDir, 'dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
