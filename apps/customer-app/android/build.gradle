// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

def projectRoot = rootDir.getParentFile()
def workspaceRoot = projectRoot.getParentFile().getParentFile()

def findPackageDir = { String pkgName ->
  def localPath = new File(projectRoot, "node_modules/" + pkgName)
  if (localPath.exists()) return localPath
  def rootPath = new File(workspaceRoot, "node_modules/" + pkgName)
  if (rootPath.exists()) return rootPath
  try {
    def resolved = ["node", "--print", "require.resolve('" + pkgName + "/package.json')"].execute(null, rootDir).text.trim()
    if (resolved) return new File(resolved).getParentFile()
  } catch (Exception e) {}
  return localPath
}

def reactNativeDir = findPackageDir("react-native")
def jscAndroidDir = findPackageDir("jsc-android")

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(reactNativeDir, 'android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(jscAndroidDir, 'dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
