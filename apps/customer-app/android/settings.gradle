pluginManagement {
  includeBuild("react-settings-plugin")

  def gradlePluginDir = new File(settingsDir, "../../../node_modules/@react-native/gradle-plugin")
  if (!gradlePluginDir.exists()) {
    gradlePluginDir = new File(settingsDir, "../node_modules/@react-native/gradle-plugin")
  }
  includeBuild(gradlePluginDir)
}

plugins { id("com.facebook.react.settings") }

rootProject.name = 'Kandy Cabs Customer'

def rnDir = new File(settingsDir, "../../../node_modules/react-native")
if (!rnDir.exists()) {
  rnDir = new File(settingsDir, "../node_modules/react-native")
}

def expoDir = new File(settingsDir, "../../../node_modules/expo")
if (!expoDir.exists()) {
  expoDir = new File(settingsDir, "../node_modules/expo")
}

def cliDir = new File(settingsDir, "../../../node_modules/@react-native-community/cli-platform-android")
if (!cliDir.exists()) {
  cliDir = new File(settingsDir, "../node_modules/@react-native-community/cli-platform-android")
}

def gradlePluginDir = new File(settingsDir, "../../../node_modules/@react-native/gradle-plugin")
if (!gradlePluginDir.exists()) {
  gradlePluginDir = new File(settingsDir, "../node_modules/@react-native/gradle-plugin")
}

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(rnDir, "gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(expoDir, "scripts/autolinking.gradle")
useExpoModules()

apply from: new File(cliDir, "native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

include ':app'
includeBuild(gradlePluginDir)
